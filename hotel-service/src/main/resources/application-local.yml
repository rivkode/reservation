server:
  port: 8081

# IDE 에서 직접 실행하는 로컬 프로파일.
# docker compose 는 인프라 (mysql · redis · kafka) 만 기동하고, 동일 포트의 app
# 컨테이너 (hotel-service = 8081) 는 반드시 정지한 상태에서 사용한다.
# (README §6-1 참조)

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/hotel?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: reservation
    password: change-me-app
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: 127.0.0.1:29092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  # PR-3.1 — RoomAvailabilityView Read Model 저장소. docker-compose 의 hotel-redis 컨테이너
  # (requirepass 적용) 를 host-port 6379 로 바라본다. password 는 compose 의 .env 와 동일하게
  # 로컬 쉘 환경변수 REDIS_PASSWORD 로 주입하거나, IDE run configuration 에 설정한다.
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}

app:
  outbox:
    poll-delay-ms: 1000
    batch-size: 100
    send-timeout-ms: 5000
  # PR-3.1 — reservation-events 구독 consumer 그룹. hotel-service 전용 group-id 로
  # reservation-service 내부 consumer 와 완전 분리된 offset 을 가진다.
  kafka:
    consumer:
      reservation-events:
        group-id: hotel-service.reservation-events
  # PR-3.3 — 가용성 캐시 재구축 배치. IDE 로컬 실행 기본값은 활성화. cron 은 Asia/Seoul
  # 기준 매일 02:00. horizon 은 PRD §13 Q7 의 "90일" 과 정합.
  availability:
    max-range-days: 90
    rebuild:
      enabled: true
      horizon-days: 90
      cron: "0 0 2 * * *"
      zone: Asia/Seoul

# PR-3.3 — reservation-service StreamInventory gRPC 클라이언트. 로컬에서는 별도 프로세스로
# 기동한 reservation-service (port 9094) 를 바라본다.
grpc:
  client:
    reservation-service:
      address: "static://127.0.0.1:9094"
      negotiation-type: plaintext
