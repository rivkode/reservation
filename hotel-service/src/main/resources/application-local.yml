server:
  port: 8081

# IDE 에서 직접 실행하는 로컬 프로파일.
# docker compose 는 인프라 (mysql · redis · kafka) 만 기동하고, 동일 포트의 app
# 컨테이너 (hotel-service = 8081) 는 반드시 정지한 상태에서 사용한다.
# (README §6-1 참조)

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/hotel?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: reservation
    password: change-me-app
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: 127.0.0.1:29092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

app:
  outbox:
    poll-delay-ms: 1000
    batch-size: 100
    send-timeout-ms: 5000
