server:
  port: 0

# 단위 · 슬라이스 테스트 기본값. @SpringBootTest(webEnvironment = ...) 에 따라 실제
# 바인딩 유무가 결정된다. Testcontainers 기반 통합 테스트는 MysqlContainerExtension
# 이 spring.datasource.* 를 시스템 프로퍼티로 주입하므로 여기의 값은 덮어써진다.
#
# contextLoads 스모크 테스트(프레임워크 스타트업 검증) 는 MySQL 컨테이너 없이
# H2 in-memory 로 띄운다. Flyway 는 MySQL 방언 SQL 을 포함하므로 비활성화하고
# Hibernate ddl-auto=create-drop 로 JPA 메타데이터에서 스키마를 만든다.
spring:
  datasource:
    url: jdbc:h2:mem:hotel-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  # PR-3.1 — Redis 는 Testcontainers 통합 테스트가 DynamicPropertySource / 수동 wiring 으로
  # 주입한다. 스모크 테스트는 실제 Redis 를 기동하지 않고 Spring Boot 의 spring.data.redis
  # 자동설정만 통과하면 되므로 localhost:6379 를 기본값으로 둔다 — consumer/cache 는
  # 리스너 autoStartup=false, 테스트 프로파일에서 빈 주입만 확인한다.
  data:
    redis:
      host: localhost
      port: 6379

app:
  outbox:
    poll-delay-ms: 60000
  # PR-3.1 — @KafkaListener autoStartup 제어. 스모크/슬라이스 테스트는 실 브로커 없이 기동
  # 하므로 리스너를 정지 상태로 시작한다. 실 Kafka 연동 검증은 별도 통합 테스트가 명시적으로
  # true 로 오버라이드한다.
  kafka:
    listener:
      auto-startup: false
    consumer:
      reservation-events:
        group-id: hotel-service.reservation-events.test
  # PR-3.3 — 테스트에서는 Scheduler 빈을 비활성화해 ApplicationReadyEvent / @Scheduled 가
  # 실제 gRPC 호출을 시도하지 않게 한다. 필요한 통합 테스트는 명시적으로 true 로 override.
  availability:
    rebuild:
      enabled: false

# PR-3.3 — 테스트에서는 gRPC 클라이언트 채널을 in-process 로 지정 (개별 테스트가 stub 을
# 별도로 주입하는 경우가 많음). reservation-service 라벨만 설정해 net.devh 자동설정 오류
# 를 방지.
grpc:
  client:
    reservation-service:
      address: "in-process:reservation-service-test"
      negotiation-type: plaintext
