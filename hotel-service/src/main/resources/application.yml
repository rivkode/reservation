spring:
  application:
    name: hotel-service
  profiles:
    # SPRING_PROFILES_ACTIVE 가 env 로 주입되지 않은 경우 local 을 적용한다.
    # (IDE 직접 실행 시 기본값 · docker-compose 는 명시적으로 'docker' 를 주입)
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
