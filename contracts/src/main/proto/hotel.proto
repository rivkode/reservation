syntax = "proto3";

package com.reservation.contracts.hotel;

option java_multiple_files = true;
option java_package = "com.reservation.contracts.hotel";
option java_outer_classname = "HotelProto";

// hotel-service 가 제공. PRD §7.1 에 "(향후)" 로 기재되어 있어 현재 호출자는 없으나
// 계약을 선정의해 두어 이후 다른 서비스가 추가될 때 서비스 경계를 흔들지 않는다.
service HotelQueryService {
  rpc GetHotel(GetHotelRequest) returns (Hotel);
  rpc GetRoomType(GetRoomTypeRequest) returns (RoomType);
}

message Hotel {
  string id = 1;
  string name = 2;
  // 검색 · 필터 (도시/국가) 요구(FR-H-02)를 위해 구조화된 주소. ddd-architect
  // C1 결정에 따라 단일 string → HotelAddress nested message 로 확장.
  // HotelQueryService 에 아직 호출자가 없어 wire-compat breaking 영향 없음.
  HotelAddress address = 3;
  int32 star_rating = 4;
}

message HotelAddress {
  string street = 1;
  string city = 2;
  // ISO-3166 국가 코드 권장 (추후 CountryCode VO 로 래핑 고려 — .github/docs 참조)
  string country = 3;
}

message GetHotelRequest {
  string id = 1;
}

message RoomType {
  string id = 1;
  string hotel_id = 2;
  string name = 3;
  int32 max_occupancy = 4;
}

message GetRoomTypeRequest {
  string id = 1;
}
