syntax = "proto3";

package com.reservation.contracts.guest;

option java_multiple_files = true;
option java_package = "com.reservation.contracts.guest";
option java_outer_classname = "GuestProto";

// guest-service 가 제공. reservation-service 가 예약 생성 시 투숙객 검증에 호출한다.
// 클라이언트는 Deadline 3초 · Circuit Breaker 필수 (PRD §6, CLAUDE.md 원칙 8).
service GuestService {
  rpc GetGuest(GetGuestRequest) returns (Guest);
  rpc BatchGetGuests(BatchGetGuestsRequest) returns (BatchGetGuestsResponse);
}

message Guest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone_number = 5;
}

message GetGuestRequest {
  string id = 1;
}

message BatchGetGuestsRequest {
  repeated string ids = 1;
}

message BatchGetGuestsResponse {
  repeated Guest guests = 1;
}
