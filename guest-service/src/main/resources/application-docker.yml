server:
  port: 8080

# docker-compose 가 환경변수 (SPRING_DATASOURCE_URL 등) 로 인프라 연결 정보를 주입한다.
# 본 파일은 컨테이너 환경 기본값 (ddl-auto · flyway 위치 등) 만 선언한다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# 컨테이너 내부 gRPC 포트. docker-compose 가 호스트 9093 → 컨테이너 9090 매핑.
grpc:
  server:
    port: 9090
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 5s
