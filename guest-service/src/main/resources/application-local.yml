server:
  port: 8083

# IDE 에서 직접 실행하는 로컬 프로파일.
# docker compose 는 인프라 (mysql) 만 기동하고, 동일 포트의 app
# 컨테이너 (guest-service = 8083) 는 반드시 정지한 상태에서 사용한다.
# (README §6-1 참조)

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3309/guest?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: reservation
    password: change-me-app
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# gRPC 서버 포트 — reservation-service(PR-2.x) gRPC 클라이언트가 127.0.0.1:9093 으로
# 접근. 호스트 포트 예약 계획: hotel=9091(추후) · rate=9092(추후) · guest=9093 ·
# reservation=9094(추후).
grpc:
  server:
    port: 9093
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 5s
