[versions]
spring-boot = "3.3.5"
dependency-management = "1.1.7"
protobuf = "3.25.5"
protobuf-plugin = "0.9.4"
grpc = "1.68.1"
grpc-spring-boot-starter = "3.1.0.RELEASE"
archunit = "1.3.0"
java-uuid-generator = "5.1.0"
lombok = "1.18.36"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }

# net.devh 계열 grpc-spring-boot-starter. 3.1.0.RELEASE 는 Spring Boot 3.2 지원 — 본
# 저장소는 3.3.5 를 사용하지만 autoconfigure 가 3.2+ 범위에서 호환된다. 서버 측 스타터만
# 도입 (클라이언트 스타터는 reservation-service PR-2.x 에서 추가). 하위 grpc-core/stub 는
# contracts 모듈이 관리하는 1.68.1 버전으로 고정된다.
grpc-server-spring-boot-starter = { module = "net.devh:grpc-server-spring-boot-starter", version.ref = "grpc-spring-boot-starter" }

# net.devh 의 gRPC 클라이언트 스타터. 본 저장소의 reservation-service 가 PR-2.2 부터
# guest-service · rate-service 에 동기 호출하기 위해 도입. @GrpcClient 주입과 채널/
# Deadline 기본값을 application.yml 로 관리할 수 있게 한다.
grpc-client-spring-boot-starter = { module = "net.devh:grpc-client-spring-boot-starter", version.ref = "grpc-spring-boot-starter" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }

# PR-3.1 hotel-service — RoomAvailabilityView Read Model 저장소. Lettuce 클라이언트(기본)
# + spring-data-redis + connection pooling 을 한 번에 제공. Redis 연결 정보(host/port/
# password/database) 는 spring.data.redis.* 표준 프로퍼티로 application-*.yml 에서 주입.
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
h2 = { module = "com.h2database:h2" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }

# PR-base 추가 — 버전은 Spring Boot BOM 에서 관리되어 별도 version.ref 불요
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-mysql = { module = "org.testcontainers:mysql" }

# Boilerplate 제거 — 생성자/게터 자동 생성. Spring bean 주입 패턴에서 @RequiredArgsConstructor 로 final 필드 기반 생성자를 확보한다.
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
