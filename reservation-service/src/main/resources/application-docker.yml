server:
  port: 8080

# docker-compose 가 환경변수 (SPRING_DATASOURCE_URL · SPRING_KAFKA_BOOTSTRAP_SERVERS 등)
# 로 인프라 연결 정보를 주입한다. 본 파일은 컨테이너 환경 기본값 (ddl-auto · flyway 위치 ·
# inventory horizon 등) 만 선언한다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# 컨테이너 환경의 gRPC 채널. host 는 docker-compose service 이름. 포트는 각 서비스
# 가 노출하는 grpc-server-spring-boot-starter 기본값(9090) 을 그대로 사용한다 — 같은
# 컴포즈 네트워크 안에서 충돌이 없으므로 동일 포트 유지가 단순.
grpc:
  client:
    guest-service:
      address: "static://guest-service:9090"
      negotiation-type: plaintext
    rate-service:
      address: "static://rate-service:9090"
      negotiation-type: plaintext

app:
  inventory:
    horizon-days: 90
  kafka:
    consumer:
      hotel-events:
        group-id: reservation-service.hotel-events
