server:
  port: 8084

# IDE 에서 직접 실행하는 로컬 프로파일.
# docker compose 는 인프라 (mysql · kafka) 만 기동하고, 동일 포트의 app
# 컨테이너 (reservation-service = 8084) 는 반드시 정지한 상태에서 사용한다.
# (README §6-1 참조)

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3310/reservation?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: reservation
    password: change-me-app
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    # docker-compose kafka 브로커의 EXTERNAL 리스너 (PLAINTEXT://127.0.0.1:29092)
    bootstrap-servers: 127.0.0.1:29092

# net.devh grpc-client-spring-boot-starter 채널 설정. 로컬 IDE 실행 시 다른 서비스가
# 같은 호스트의 다른 포트에서 기동중이라고 가정한다 (각 서비스 application-local.yml
# 의 grpc.server.port 와 정합 필요 — guest-service / rate-service 의 PR 에서 확정).
grpc:
  client:
    guest-service:
      address: "static://127.0.0.1:9091"
      negotiation-type: plaintext
    rate-service:
      address: "static://127.0.0.1:9092"
      negotiation-type: plaintext

app:
  inventory:
    # PRD §13 Q7 — hotel-service Redis 캐시 범위(90일)와 정합. 이벤트 수신 시 오늘 ~ 오늘+N
    # 일 범위의 RoomTypeInventory row 를 선제 생성/갱신한다. horizon 확장 배치는 PR-3.x
    # 범위.
    horizon-days: 90
  kafka:
    consumer:
      hotel-events:
        group-id: reservation-service.hotel-events
      billing-events:
        group-id: reservation-service.billing-events
